name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[xtb,dev]"
      - name: Lint and type-check
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy
      - name: Tests (fast tier)
        run: pytest -q -m "not slow"
      - name: Installation verification
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install --quiet . && /tmp/clean/bin/sitewindow --version
      - name: Theory tables and validation (verification tier)
        run: |
          sitewindow theory-tables
          sitewindow validate --tier verify
      - name: Build distributions
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: dist
          path: dist/
