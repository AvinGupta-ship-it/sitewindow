[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sitewindow"
version = "0.1.0"
description = "Site-energy landscapes and deliverable-capacity limits for hydrogen storage in defect-engineered sp2 carbon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Avin Gupta" }]
keywords = [
  "hydrogen storage", "carbon nanomaterials", "graphene", "carbon nanotubes",
  "defect engineering", "adsorption", "chemisorption", "deliverable capacity",
  "electron irradiation", "uncertainty quantification",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "pyarrow>=15",
  "pydantic>=2.6",
  "pyyaml>=6",
  "typer>=0.12",
  "matplotlib>=3.8",
  "ase>=3.23",
]

[project.optional-dependencies]
xtb = ["tblite>=0.4"]
mace = ["mace-torch>=0.3.6", "torch>=2.1"]
pyscf = ["pyscf>=2.5"]
bayes = ["pymc>=5.10", "arviz>=0.17"]
uq = ["SALib>=1.4.7"]
eos = ["CoolProp>=6.6"]
dev = [
  "pytest>=8", "hypothesis>=6.98", "ruff>=0.4", "mypy>=1.9",
  "pytest-cov>=5", "build>=1.2", "twine>=5", "pip-tools>=7.4",
  "mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25",
]
all = ["sitewindow[xtb,mace,pyscf,bayes,uq,eos]"]

[project.scripts]
sitewindow = "sitewindow.workflows.cli:app"

[project.entry-points."sitewindow.calculators"]
tblite = "sitewindow.atomistic.calculators.tblite_adapter:TBLiteCalculator"
mace = "sitewindow.atomistic.calculators.mace_adapter:MACECalculator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sitewindow = ["py.typed", "data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "W"]
ignore = ["E501", "B008", "B905", "E731"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
files = ["src/sitewindow/theory", "src/sitewindow/kinetics", "src/sitewindow/schema", "src/sitewindow/units.py", "src/sitewindow/constants.py"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: tests requiring external calculators or long runtimes",
  "xtb: tests requiring tblite",
  "bayes: tests requiring pymc",
]
