# Material metadata of corpus materials (manual C6, data source S2 role): BET areas, pore
# volumes and source types that the ISODB records do not carry. Every value was read in the
# source publication; `where_read` names the place (abstract, table, paragraph) and `access`
# how the text was reached (the publishers' pages refuse automated clients, so abstracts were
# read through the OpenAlex index of the publisher abstract; full texts only where an open copy
# exists). `sample_identity: ambiguous` marks a database record whose name does not identify
# which of several carbons in the paper it belongs to; such records keep their isotherms but
# receive no surface area. `simulated: true` marks isotherms the paper computed rather than
# measured; they are excluded from the experimental inference with the reason logged.
#
# Fields: doi, adsorbent_hashkey, adsorbent_name, bet_area_m2_g, bet_area_sd_m2_g,
# pore_volume_cm3_g, sample_identity, simulated, value_source (primary: read in the paper or an
# open copy of it; secondary: read in another paper's table citing it, kept for the record and
# not used by B7), where_read, access, notes.
