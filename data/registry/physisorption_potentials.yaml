# Pairwise H2-C Lennard-Jones parameters (manual C2, physisorption potentials; DERIVATIONS 2.10).
# H2 is a single site. The two literature sets are Lorentz-Berthelot combinations of Steele's
# graphite-carbon parameters with a published H2 set; the calibrated set scales the well depth of
# the Steele-Buch combination so that the classical minimum over coronene reproduces benchmark B3
# (-4.7 kJ/mol), which the benchmark registry designates as the anchor for these parameters. The
# scale factor is computed by the code (the potential is linear in epsilon); it is recorded here
# for reference and is checked by a test.
carbon:
  steele_graphite: { epsilon_K: 28.0, sigma_A: 3.40, source: "W. A. Steele, Surf. Sci. 36, 317 (1973)" }
hydrogen:
  buch: { epsilon_K: 34.2, sigma_A: 2.96, source: "V. Buch, J. Chem. Phys. 100, 7610 (1994)" }
  darkrim_levesque: { epsilon_K: 36.7, sigma_A: 2.958, source: "F. Darkrim, D. Levesque, J. Chem. Phys. 109, 4981 (1998)" }
combined:
  steele_buch: { epsilon_K: 30.945, sigma_A: 3.180, rule: Lorentz-Berthelot, status: literature }
  steele_darkrim_levesque: { epsilon_K: 32.056, sigma_A: 3.179, rule: Lorentz-Berthelot, status: literature }
  steele_buch_b3: { base: steele_buch, sigma_A: 3.180, calibration: "epsilon scaled so that E_min(coronene) = -4.7 kJ/mol (B3)", status: calibrated_to_B3 }
oxygen:
  # OPLS-AA Lennard-Jones parameters of oxygen by group type (kcal/mol converted to K); H2-O pairs
  # are Lorentz-Berthelot combinations with the H2 set of each potential. The B3 scale factor of
  # the calibrated set applies to the carbon pair only, B3 being a carbon-only benchmark. Group
  # hydrogens carry no Lennard-Jones centre, as in OPLS-AA.
  source: "W. L. Jorgensen, D. S. Maxwell, J. Tirado-Rives, J. Am. Chem. Soc. 118, 11225 (1996)"
  ether: { epsilon_kcal_mol: 0.140, epsilon_K: 70.45, sigma_A: 2.90, groups: [epoxide] }
  alcohol: { epsilon_kcal_mol: 0.170, epsilon_K: 85.55, sigma_A: 3.12, groups: [hydroxyl, carboxyl O-H] }
  carbonyl: { epsilon_kcal_mol: 0.210, epsilon_K: 105.68, sigma_A: 2.96, groups: [carbonyl pair, carboxyl C=O] }
  assignment: "by bonding environment: two carbon neighbours -> ether; a hydrogen neighbour -> alcohol; otherwise carbonyl"
feynman_hibbs:
  mass_amu: 2.01588
  note: "second-order correction with the H2 mass against a rigid carbon framework"
