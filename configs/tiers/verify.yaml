# Verification tier: reduced configurations for a 2-core machine; outputs labeled "verify".
# Class set per manual Section 16: basal monomer and dimers, monovacancy 1-3 H, one Stone-Wales
# site, three nanotube diameters; Tier 2 (GFN2-xTB) with a single Tier-1 anchor from the active
# density-functional engine at reduced settings.
tier: verify
atomistic:
  calculator: tblite
  method: GFN2-xTB
  # Gamma-only sampling in tblite: Fermi smearing at 3000 K and 9x9 sheets (manual Section 10, Tier 2).
  calculator_settings_tblite: { electronic_temperature: 3000.0 }
  supercell: 9
  # Sticking barriers are referenced to the separated reactants: integer occupations (300 K) in a cell
  # that does not fold the Dirac point onto Gamma (manual Section 10, Tier 2).
  barriers:
    stick: { supercell: 10, calculator_settings_tblite: { electronic_temperature: 300.0 } }
  fmax_eV_A: 0.05
  classes: [basal, monovacancy, stone_wales, cnt_armchair]
  # Armchair tubes: 6 unit cells (the lengths that sample the Fermi point converge monotonically; manual Section 10, Tier 2).
  cnt: { diameters_nm: [0.68, 1.09, 1.36], length_armchair: 6, length_zigzag: 4 }
  tier1_anchor: { engine: gpaw, supercell: 4, ecut_eV: 400, kmesh: [3, 3, 1], vacuum_A: 12 }
theory:
  windows: [BM2006, W1, W2, W3]
  entropy_models: [constant, harmonic_oscillator, two_d_gas]
corpus:
  max_materials: 20
posterior_samples: 500
